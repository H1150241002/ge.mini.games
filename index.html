        body {
            font-family: 'Zen Maru Gothic', sans-serif, system-ui;
            user-select: none;
            background-color: #2d5a27;
            overflow-x: hidden;
        }

        /* 村莊背景圖案與地圖紋理 */
        .village-bg {
            background-color: #7ec850;
            background-image: 
                radial-gradient(#6eb242 15%, transparent 16%),
                radial-gradient(#8cd75d 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* 茅草屋跳動動畫 */
        @keyframes hut-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }

        .animate-hut {
            animation: hut-bounce 2.5s infinite ease-in-out;
        }

        .animate-hut:nth-child(even) {
            animation-delay: 0.5s;
        }

        .animate-hut:nth-child(3n) {
            animation-delay: 1.2s;
        }

        /* 水流動畫 */
        .river {
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            opacity: 0.85;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
        }

        /* 懸停光暈效果 */
        .hut-card {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .hut-card:hover {
            transform: scale(1.1) translateY(-5px);
            filter: drop-shadow(0 12px 15px rgba(0,0,0,0.3));
        }

        /* 自訂模態框彈出動畫 */
        @keyframes modal-pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal {
            animation: modal-pop 0.3s ease-out forwards;

                question: "「SDGs 目標 5：性別平權」的主要核心精神是：",
                options: [
                    "讓女性擁有高於男性的特權",
                    "消除所有基於性別的不平等，實現人人享有平等的權利、機會與資源",
                    "強調男女在所有物理生理條件上完全一模一樣",
                    "僅關注開發中國家的女性權益，已開發國家不需要努力"
                ],
                answer: 1,
                explanation: "性別平權並非要取代或優越於另一性別，而是讓所有人不論性別都能獲得平等尊重、資源與發展機會。"
            }
        ];

        // 10 座茅草屋在 2D 地圖上的相對位置百分比 (%)
        const hutPositions = [
            { top: 15, left: 15 },
            { top: 12, left: 45 },
            { top: 18, left: 78 },
            { top: 38, left: 18 },
            { top: 36, left: 52 },
            { top: 40, left: 82 },
            { top: 62, left: 12 },
            { top: 65, left: 42 },
            { top: 68, left: 72 },
            { top: 82, left: 88 }
        ];

        // 遊戲當前狀態
        let hutStates = Array(10).fill('unanswered'); // 'unanswered', 'correct', 'incorrect'
        let answeredCount = 0;
        let scoreCount = 0;
        let currentHutIndex = null;
        let selectedOption = null;

        // 音效合成器
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                }
            } catch(e) {
                // 音效播放失敗時優雅忽視
            }
        };

        // 初始化並渲染 10 座茅草屋地圖
        function renderMap() {
            const container = document.getElementById('huts-container');
            container.innerHTML = '';

            hutPositions.forEach((pos, index) => {
                const state = hutStates[index];
                const hutDiv = document.createElement('div');
                hutDiv.className = `absolute hut-card cursor-pointer flex flex-col items-center justify-center ${state === 'unanswered' ? 'animate-hut' : ''}`;
                hutDiv.style.top = `${pos.top}%`;
                hutDiv.style.left = `${pos.left}%`;
                hutDiv.onclick = () => openQuizModal(index);

                let roofColor = '#d97706';
                let houseGlow = 'drop-shadow(0 4px 6px rgba(0,0,0,0.3))';
                let statusBadge = '';

                if (state === 'correct') {
                    roofColor = '#059669';
                    houseGlow = 'drop-shadow(0 0 12px rgba(16, 185, 129, 0.9))';
                    statusBadge = `
                        <div class="absolute -top-2 -right-2 bg-emerald-500 text-white w-7 h-7 rounded-full flex items-center justify-center border-2 border-white shadow-lg text-sm font-black">
                            <i class="fa-solid fa-check"></i>
                        </div>`;
                } else if (state === 'incorrect') {
                    roofColor = '#6b7280';
                    houseGlow = 'grayscale(80%)';
                    statusBadge = `
                        <div class="absolute -top-2 -right-2 bg-rose-500 text-white w-7 h-7 rounded-full flex items-center justify-center border-2 border-white shadow-lg text-sm font-black">
                            <i class="fa-solid fa-xmark"></i>
                        </div>`;
                } else {
                    statusBadge = `
                        <div class="absolute -top-3 bg-amber-400 text-amber-950 font-black px-2 py-0.5 rounded-full text-xs shadow border border-amber-200 animate-pulse">
                            <i class="fa-solid fa-lightbulb"></i> 挑戰
                        </div>`;
                }

                hutDiv.innerHTML = `
                    <div class="relative flex flex-col items-center" style="filter: ${houseGlow}">
                        ${statusBadge}
                        <svg width="68" height="68" viewBox="0 0 100 100" class="transition-transform duration-300">
                            <path d="M 50 10 L 90 45 L 10 45 Z" fill="${roofColor}" stroke="#78350f" stroke-width="4" stroke-linejoin="round"/>
                            <path d="M 50 10 L 80 45 M 50 10 L 20 45 M 50 10 L 50 45" stroke="#b45309" stroke-width="2"/>
                            <rect x="20" y="45" width="60" height="45" fill="${state === 'correct' ? '#fef3c7' : '#fde68a'}" stroke="#78350f" stroke-width="4" rx="2"/>
                            <rect x="42" y="60" width="16" height="30" fill="#78350f" rx="3"/>
                            <rect x="26" y="55" width="12" height="12" fill="${state === 'correct' ? '#facc15' : '#78350f'}" stroke="#451a03" stroke-width="2" rx="1"/>
                            <rect x="62" y="55" width="12" height="12" fill="${state === 'correct' ? '#facc15' : '#78350f'}" stroke="#451a03" stroke-width="2" rx="1"/>
                        </svg>
                        <span class="mt-1 bg-amber-950/80 text-amber-200 text-xs font-bold px-2 py-0.5 rounded-md border border-amber-700 shadow">
                            茅草屋 #${index + 1}
                        </span>
                    </div>
                `;
                container.appendChild(hutDiv);
            });
        }

        // 開啟題目 Modal
        function openQuizModal(index) {
            currentHutIndex = index;
            selectedOption = null;
            const q = questions[index];

            document.getElementById('modal-hut-tag').innerText = `茅草屋 #${index + 1}`;
            document.getElementById('quiz-question').innerText = `${index + 1}. ${q.question}`;

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            const isAnswered = hutStates[index] !== 'unanswered';

            q.options.forEach((optText, optIdx) => {
                const optBtn = document.createElement('button');
                optBtn.className = `w-full text-left p-3.5 rounded-xl border-2 font-medium transition flex items-center justify-between text-sm sm:text-base ${
                    isAnswered ? 'cursor-not-allowed opacity-80' : 'hover:bg-amber-100/80 active:scale-[0.99]'
                } border-amber-300 bg-white text-gray-800`;

                optBtn.innerHTML = `
                    <span>${String.fromCharCode(65 + optIdx)}. ${optText}</span>
                    <i class="fa-regular fa-circle text-amber-400 opt-icon"></i>
                `;

                if (!isAnswered) {
                    optBtn.onclick = () => selectOption(optIdx);
                } else {
                    if (optIdx === q.answer) {
                        optBtn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                        optBtn.querySelector('.opt-icon').className = 'fa-solid fa-circle-check text-emerald-600';
                    }
                }

                optionsContainer.appendChild(optBtn);
            });

            const feedback = document.getElementById('quiz-feedback');
            const nextBtn = document.getElementById('modal-next-btn');

            if (isAnswered) {
                feedback.classList.remove('hidden');
                feedback.className = `mb-4 p-4 rounded-2xl border-2 text-sm leading-relaxed ${
                    hutStates[index] === 'correct' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'
                }`;
                document.getElementById('feedback-title').innerHTML = hutStates[index] === 'correct' 
                    ? `<i class="fa-solid fa-circle-check text-emerald-600"></i> 回答正確！` 
                    : `<i class="fa-solid fa-circle-xmark text-rose-600"></i> 提示說明：`;
                document.getElementById('feedback-desc').innerText = q.explanation;
                nextBtn.classList.add('hidden');
            } else {
                feedback.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }

            document.getElementById('quiz-modal').classList.remove('hidden');
        }

        // 選擇選項
        function selectOption(optIdx) {
            selectedOption = optIdx;
            const optionsContainer = document.getElementById('quiz-options');
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach((btn, idx) => {
                if (idx === optIdx) {
                    btn.className = 'w-full text-left p-3.5 rounded-xl border-2 font-medium transition flex items-center justify-between text-sm sm:text-base border-amber-600 bg-amber-100/90 text-amber-950 shadow-sm';
                    btn.querySelector('.opt-icon').className = 'fa-solid fa-circle-dot text-amber-600';
                } else {
                    btn.className = 'w-full text-left p-3.5 rounded-xl border-2 font-medium transition flex items-center justify-between text-sm sm:text-base border-amber-300 bg-white text-gray-800';
                    btn.querySelector('.opt-icon').className = 'fa-regular fa-circle text-amber-400';
                }
            });

            const nextBtn = document.getElementById('modal-next-btn');
            nextBtn.classList.remove('hidden');
        }

        // 確認提交答案
        function confirmAnswer() {
            if (selectedOption === null || currentHutIndex === null) return;

            const q = questions[currentHutIndex];
            const isCorrect = selectedOption === q.answer;

            closeQuizModal();

            if (isCorrect) {
                hutStates[currentHutIndex] = 'correct';
                scoreCount++;
                playSound('correct');
                
                // 答對時：跳出美女圖獎勵 Modal
                showBeautyReward(currentHutIndex, q.explanation);
            } else {
                hutStates[currentHutIndex] = 'incorrect';
                playSound('wrong');
                
                // 答錯時：重新打開 Modal 顯示正確答案解析
                openQuizModal(currentHutIndex);
            }

            answeredCount++;
            document.getElementById('score-text').innerText = scoreCount;
            renderMap();

            // 如果答錯且已是最後一題，則觸發結算
            if (!isCorrect && answeredCount >= 10) {
                setTimeout(showFinalResult, 600);
            }
        }

        // 展示美女圖獎勵 Modal
        function showBeautyReward(index, explanation) {
            const rewardModal = document.getElementById('reward-modal');
            const imgEl = document.getElementById('reward-img');
            const captionEl = document.getElementById('reward-img-caption');
            const explanationEl = document.getElementById('reward-explanation');

            // 依據題目索引獲取美女圖片，確保每題都有專屬精美圖片
            const beautyData = beautyImages[index % beautyImages.length];

            imgEl.src = beautyData.url;
            captionEl.innerText = beautyData.caption;
            explanationEl.innerText = explanation;

            rewardModal.classList.remove('hidden');
        }

        // 關閉美女圖獎勵 Modal
        function closeRewardModal() {
            document.getElementById('reward-modal').classList.add('hidden');

            // 如果全部做答完畢，開啟最終結算
            if (answeredCount >= 10) {
                setTimeout(showFinalResult, 400);
            }
        }

        function closeQuizModal() {
            document.getElementById('quiz-modal').classList.add('hidden');
        }

        // 顯示最終結算彈窗
        function showFinalResult() {
            const resultModal = document.getElementById('result-modal');
            const iconContainer = document.getElementById('result-icon-container');
            const titleEl = document.getElementById('result-title');
            const scoreInfoEl = document.getElementById('result-score-info');
            const descEl = document.getElementById('result-desc');
            const actionsEl = document.getElementById('result-actions');

            scoreInfoEl.innerText = `最終成績：答對 ${scoreCount} / 10 題`;

            if (scoreCount >= 8) {
                // 通關成功 (>= 8題)
                playSound('win');
                iconContainer.className = 'w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-5xl shadow-inner bg-emerald-100 text-emerald-600 border-4 border-emerald-400';
                iconContainer.innerHTML = '<i class="fa-solid fa-trophy animate-bounce"></i>';
                
                titleEl.innerText = '恭喜順利通過第一關！';
                titleEl.className = 'text-2xl font-black mb-2 text-emerald-800';
                
                descEl.innerText = '太棒了！村莊因你傳播的性別平權知識而煥然一新，村民們開始相互尊重與合作。準備好迎接下一關的挑戰了嗎？';
                
                actionsEl.innerHTML = `
                    <a href="level2.html" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 px-6 rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-lg">
                        前往下一關 <i class="fa-solid fa-circle-arrow-right"></i>
                    </a>
                `;
            } else {
                // 通關失敗 (< 8題)
                iconContainer.className = 'w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-5xl shadow-inner bg-rose-100 text-rose-600 border-4 border-rose-300';
                iconContainer.innerHTML = '<i class="fa-solid fa-heart-crack"></i>';
                
                titleEl.innerText = '挑戰失敗，再接再厲！';
                titleEl.className = 'text-2xl font-black mb-2 text-rose-800';
                
                descEl.innerText = '村莊裡還有些性別刻板印象需要被破除喔！你需要答對 8 題以上才能順利晉級。重新複習一下知識再試一次吧！';
                
                actionsEl.innerHTML = `
                    <button onclick="restartGame()" class="w-full bg-amber-500 hover:bg-amber-600 text-amber-950 font-black py-3 px-6 rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-lg border-2 border-amber-600">
                        <i class="fa-solid fa-rotate-right"></i> 重新挑戰
                    </button>
                `;
            }

            resultModal.classList.remove('hidden');
        }

        // 重新挑戰（重新載入頁面）
        function restartGame() {
            window.location.reload();
        }

        // 頁面初始化
        window.onload = function() {
            renderMap();
        };
    </script>
</body>
</html>
