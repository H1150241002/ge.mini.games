<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs性別平權 - 情境題 (Level 2)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            touch-action: manipulation;
        }
        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
        /* Keyframe animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }
        @keyframes bounceCheer {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        @keyframes popIn {
            0% { transform: scale(0.5) opacity(0); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1) opacity(1); }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }
        .animate-bounce-cheer {
            animation: bounceCheer 1.2s ease-in-out infinite;
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animate-sparkle {
            animation: sparkle 1.5s ease-in-out infinite;
        }
        /* Custom drag shadow and active styles */
        .dragging {
            opacity: 0.8;
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            cursor: grabbing !important;
        }
        .drop-target-active {
            transform: scale(1.02);
            border-color: #f59e0b !important;
            background-color: rgba(254, 243, 199, 0.8) !important;
        }
    </style>
</head>
<body class="bg-sky-200 min-h-screen flex flex-col justify-between overflow-x-hidden relative">

    <!-- Theme Park Background & Decorations -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <!-- Sky / Cloud elements -->
        <div class="absolute top-10 left-10 text-white/70 text-6xl animate-float" style="animation-delay: 0s;"><i class="fa-solid font-cloud"></i>☁️</div>
        <div class="absolute top-20 right-20 text-white/70 text-7xl animate-float" style="animation-delay: 1.5s;">☁️</div>
        <div class="absolute top-40 left-1/3 text-white/50 text-5xl animate-float" style="animation-delay: 2.5s;">☁️</div>
        
        <!-- Theme park Ferris Wheel silhouette background element -->
        <div class="absolute -bottom-10 -right-10 opacity-10 text-pink-900 text-[250px] leading-none select-none">
            🎡
        </div>
        <!-- Castle graphic background element -->
        <div class="absolute -bottom-10 -left-10 opacity-10 text-indigo-900 text-[220px] leading-none select-none">
            🏰
        </div>

        <!-- 3 Flowers randomly positioned in lower half -->
        <div id="flower1" class="absolute bottom-12 left-[15%] text-4xl animate-bounce-cheer" style="animation-delay: 0.2s;">🌸</div>
        <div id="flower2" class="absolute bottom-8 left-[50%] -translate-x-1/2 text-5xl animate-bounce-cheer" style="animation-delay: 0.8s;">🌻</div>
        <div id="flower3" class="absolute bottom-14 right-[18%] text-4xl animate-bounce-cheer" style="animation-delay: 1.4s;">🌺</div>
    </div>

    <!-- Header Section -->
    <header class="relative z-10 w-full p-4 md:p-6 flex justify-between items-center bg-white/80 backdrop-blur-md shadow-md rounded-b-2xl border-b-4 border-pink-300">
        <!-- Title at top left -->
        <div class="flex items-center gap-3">
            <span class="text-3xl md:text-4xl">🎪</span>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-pink-600 tracking-wide drop-shadow-sm">SDGs性別平權 - 情境題</h1>
                <p class="text-xs md:text-sm text-gray-500 font-bold">Level 2 : 拖曳正確概念到目標區域</p>
            </div>
        </div>

        <!-- Score & Progress at top right -->
        <div class="flex items-center gap-4">
            <div class="bg-pink-100 border-2 border-pink-400 rounded-2xl px-4 py-2 flex items-center gap-2 shadow-inner">
                <span class="text-xl">⭐</span>
                <span class="text-sm md:text-base font-bold text-pink-700">得分:</span>
                <span id="score-display" class="font-fredoka text-2xl md:text-3xl text-pink-600">0</span>
                <span class="text-xs text-pink-400 font-bold">/ 60</span>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="relative z-10 container mx-auto px-4 py-6 flex-1 flex flex-col justify-center items-center max-w-5xl">
        
        <!-- Question Set Indicator -->
        <div class="mb-4 bg-white/90 px-6 py-2 rounded-full shadow-md border-2 border-amber-300 flex items-center gap-2">
            <span class="text-amber-500 font-bold text-sm md:text-base">關卡進度：</span>
            <div id="progress-dots" class="flex gap-2">
                <span class="w-3 h-3 rounded-full bg-pink-500 ring-2 ring-pink-200"></span>
                <span class="w-3 h-3 rounded-full bg-gray-300"></span>
                <span class="w-3 h-3 rounded-full bg-gray-300"></span>
            </div>
            <span id="set-counter-text" class="ml-2 text-xs font-bold text-gray-600">第 1 / 3 組</span>
        </div>

        <!-- Draggable Cards Pool -->
        <section class="w-full mb-8">
            <h2 class="text-center font-bold text-gray-700 mb-3 text-sm md:text-base flex items-center justify-center gap-2">
                <span>👇</span> 請將下方的情境卡片拖曳至對應的箱子中：
            </h2>
            <div id="drag-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-3xl mx-auto min-h-[120px]">
                <!-- Cards dynamically populated -->
            </div>
        </section>

        <!-- Target Drop Zones -->
        <section class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mt-2">
            <!-- Drop Zone 1: 性別平等 -->
            <div id="drop-zone-equal" data-type="equal" class="drop-zone bg-emerald-50/90 border-4 border-dashed border-emerald-400 rounded-3xl p-5 flex flex-col items-center justify-between min-h-[220px] transition-all duration-300 shadow-lg hover:shadow-emerald-200">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-3xl">⚖️</span>
                    <h3 class="text-xl md:text-2xl font-black text-emerald-700">性別平等</h3>
                </div>
                <div class="cards-target flex-1 w-full flex flex-col gap-2 justify-center items-center border-2 border-emerald-200/50 rounded-2xl p-3 bg-white/60">
                    <p class="placeholder-text text-emerald-400 font-bold text-sm text-center">拖曳「平等情境」放置於此</p>
                </div>
            </div>

            <!-- Drop Zone 2: 性別不平等 -->
            <div id="drop-zone-unequal" data-type="unequal" class="drop-zone bg-rose-50/90 border-4 border-dashed border-rose-400 rounded-3xl p-5 flex flex-col items-center justify-between min-h-[220px] transition-all duration-300 shadow-lg hover:shadow-rose-200">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-3xl">🚫</span>
                    <h3 class="text-xl md:text-2xl font-black text-rose-700">性別不平等</h3>
                </div>
                <div class="cards-target flex-1 w-full flex flex-col gap-2 justify-center items-center border-2 border-rose-200/50 rounded-2xl p-3 bg-white/60">
                    <p class="placeholder-text text-rose-400 font-bold text-sm text-center">拖曳「不平等情境」放置於此</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Correct Answer Reward Modal (Student Cheer Girl) -->
    <div id="reward-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

            <!-- Sparkle decorations -->
            <div class="absolute -top-4 -left-4 text-3xl animate-sparkle">✨</div>
            <div class="absolute -top-4 -right-4 text-3xl animate-sparkle" style="animation-delay: 0.5s;">🌟</div>
            <div class="absolute bottom-4 right-2 text-2xl animate-sparkle" style="animation-delay: 0.8s;">💖</div>

            <!-- Cheer Girl Character SVG Graphic Display -->
            <div class="w-48 h-48 mx-auto mb-2 relative flex items-center justify-center">
                <div class="absolute inset-0 bg-pink-200 rounded-full blur-xl opacity-60 animate-pulse"></div>
                <div id="cheer-girl-svg-container" class="relative z-10 w-full h-full flex items-center justify-center">
                    <!-- Dynamic SVG injected via JS -->
                </div>
            </div>

            <!-- Badge / Praise Text -->
            <div class="bg-pink-500 text-white font-black text-lg py-1 px-6 rounded-full inline-block mb-2 shadow-md">
                答對了！太棒了！
            </div>
            
            <h3 id="cheer-message" class="text-xl font-black text-pink-700 mb-2">「你太厲害了！繼續保持喔！」</h3>
            <p id="cheer-subtext" class="text-sm font-bold text-gray-600 mb-6">獲得 +10 分！平權小先鋒就是你！</p>

            <button id="btn-next-step" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-lg py-3 px-6 rounded-2xl shadow-lg transform active:scale-95 transition-all">
                繼續挑戰 🚀
            </button>
        </div>
    </div>

    <!-- Game End Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border-4 border-purple-400 max-w-lg w-full p-8 text-center shadow-2xl relative animate-pop-in">
            
            <div id="result-icon" class="text-6xl mb-3">🏆</div>
            <h2 id="result-title" class="text-3xl font-black text-purple-800 mb-2">平權達人</h2>
            
            <!-- Score summary -->
            <div class="my-4 p-4 bg-purple-50 rounded-2xl border-2 border-purple-200">
                <p class="text-gray-600 font-bold text-sm">最終得分</p>
                <p class="font-fredoka text-5xl text-purple-600 my-1"><span id="final-score">60</span> <span class="text-xl font-normal text-gray-500">/ 60</span></p>
                <p id="result-desc" class="text-purple-700 font-bold text-base mt-2">太精彩了！你對性別平等情境有非常深刻的理解！</p>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center mt-6">
                <!-- Restart button for lower scores / replay -->
                <button id="btn-restart" class="hidden flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-black py-3 px-6 rounded-2xl shadow transition-all flex items-center justify-center gap-2">
                    🔄 重新挑戰
                </button>
                
                <!-- Link to certificate.html for perfect score -->
                <a id="btn-certificate" href="certificate.html" class="hidden flex-1 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-slate-900 font-black py-3 px-6 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2">
                    🎓 領取平權證書
                </a>
            </div>
        </div>
    </div>

    <script>
        // High quality SVG Vector Art generator for Student / Schoolgirl Cheer Characters
        const CheerGirls = [
            // Character 1: Enthusiastic Sailor Uniform Student Girl with Pom-poms
            `
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                <!-- Hair Back -->
                <path d="M 50 100 Q 30 160 60 170 Q 100 130 100 100" fill="#3D2314"/>
                <path d="M 150 100 Q 170 160 140 170 Q 100 130 100 100" fill="#3D2314"/>
                <!-- Body / Uniform -->
                <path d="M 70 130 L 130 130 L 140 190 L 60 190 Z" fill="#FFFFFF"/>
                <path d="M 60 180 L 140 180 L 145 200 L 55 200 Z" fill="#1E3A8A"/> <!-- Skirt -->
                <path d="M 75 130 L 100 155 L 125 130 L 140 135 L 100 170 L 60 135 Z" fill="#1E3A8A"/> <!-- Collar -->
                <path d="M 92 145 L 108 145 L 100 165 Z" fill="#EF4444"/> <!-- Red Scarf/Ribbon -->
                <!-- Arms raising cheer pom-poms -->
                <path d="M 65 135 Q 40 110 35 85" stroke="#FFE0BD" stroke-width="12" stroke-linecap="round" fill="none"/>
                <path d="M 135 135 Q 160 110 165 85" stroke="#FFE0BD" stroke-width="12" stroke-linecap="round" fill="none"/>
                <!-- Pom-Poms Left -->
                <circle cx="30" cy="75" r="22" fill="#F43F5E"/>
                <circle cx="42" cy="65" r="18" fill="#FB7185"/>

                <circle cx="170" cy="75" r="22" fill="#F43F5E"/>
                <circle cx="158" cy="65" r="18" fill="#FB7185"/>
                <circle cx="180" cy="68" r="16" fill="#F32442"/>
                <!-- Head & Face -->
                <ellipse cx="100" cy="95" rx="35" ry="32" fill="#FFE0BD"/>
                <!-- Bangs -->
                <path d="M 65 90 Q 80 60 100 70 Q 120 60 135 90 Q 100 75 65 90 Z" fill="#522E1B"/>
                <!-- Eyes Happy Sparkle -->
                <ellipse cx="85" cy="95" rx="5" ry="7" fill="#1E293B"/>
                <ellipse cx="115" cy="95" rx="5" ry="7" fill="#1E293B"/>
                <circle cx="83" cy="93" r="2" fill="#FFFFFF"/>
                <circle cx="113" cy="93" r="2" fill="#FFFFFF"/>
                <!-- Cheeks -->
                <ellipse cx="78" cy="103" rx="6" ry="4" fill="#FDA4AF" opacity="0.8"/>
                <ellipse cx="122" cy="103" rx="6" ry="4" fill="#FDA4AF" opacity="0.8"/>
                <!-- Big Open Smile -->
                <path d="M 90 108 Q 100 122 110 108 Z" fill="#E11D48"/>
            </svg>
            `,
            // Character 2: Energetic Student Girl with Megaphone / Wink
            `
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                <!-- Twin Tails Hair -->
                <path d="M 60 80 Q 20 60 25 120 Q 55 100 65 90" fill="#EAB308"/>
                <path d="M 140 80 Q 180 60 175 120 Q 145 100 135 90" fill="#EAB308"/>
                <!-- School Blazer -->
                <path d="M 65 130 L 135 130 L 140 200 L 60 200 Z" fill="#0F172A"/>
                <path d="M 85 130 L 100 160 L 115 130 Z" fill="#FFFFFF"/>
                <path d="M 96 135 L 104 135 L 102 155 L 98 155 Z" fill="#DC2626"/> <!-- Tie -->
                <!-- Head -->
                <ellipse cx="100" cy="90" rx="36" ry="32" fill="#FFEDD5"/>
                <!-- Hair Front -->
                <path d="M 64 85 C 70 50, 130 50, 136 85 C 115 70, 85 70, 64 85 Z" fill="#CA8A04"/>
                <!-- Hair Ribbons -->
                <circle cx="62" cy="78" r="7" fill="#F43F5E"/>
                <circle cx="138" cy="78" r="7" fill="#F43F5E"/>
                <!-- Expression: Winking Eye -->
                <path d="M 78 92 Q 85 86 92 92" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
                <ellipse cx="115" cy="92" rx="5" ry="7" fill="#0F172A"/>
                <circle cx="113" cy="90" r="2" fill="#FFFFFF"/>
                <!-- Cheeks -->
                <circle cx="76" cy="100" r="5" fill="#FB7185" opacity="0.7"/>
                <circle cx="124" cy="100" r="5" fill="#FB7185" opacity="0.7"/>
                <!-- Mouth -->
                <path d="M 92 104 Q 100 114 108 104" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
                <!-- Megaphone in Hand -->
                <path d="M 130 120 L 175 95 L 185 125 L 135 135 Z" fill="#F59E0B"/>
                <ellipse cx="180" cy="110" rx="6" ry="15" fill="#3B82F6"/>
                <!-- Hand holding Megaphone -->
                <circle cx="132" cy="128" r="8" fill="#FFEDD5"/>
            </svg>
            `,
            // Character 3: Cute Gentle Student Girl holding High-Five Sign / Cheering
            `
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                <!-- Short Bob Hair -->
                <path d="M 60 70 C 50 130, 150 130, 140 70 C 150 40, 50 40, 60 70 Z" fill="#4A0E17"/>
                <!-- Head -->
                <ellipse cx="100" cy="95" rx="34" ry="30" fill="#FED7AA"/>
                <!-- Cardigan Uniform -->
                <path d="M 68 130 L 132 130 L 140 200 L 60 200 Z" fill="#F39C12"/>
                <path d="M 88 130 L 100 150 L 112 130 Z" fill="#FFFFFF"/>
                <!-- Hair Bangs -->
                <path d="M 66 85 Q 85 95 100 85 Q 115 95 134 85 Q 100 60 66 85 Z" fill="#6B1D2F"/>
                <!-- Happy Curved Eyes -->
                <path d="M 78 95 Q 85 87 92 95" stroke="#27272A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                <path d="M 108 95 Q 115 87 122 95" stroke="#27272A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                <!-- Cheeks -->
                <ellipse cx="75" cy="102" rx="7" ry="4" fill="#F43F5E" opacity="0.6"/>
                <ellipse cx="125" cy="102" rx="7" ry="4" fill="#F43F5E" opacity="0.6"/>
                <!-- Cute Smile -->
                <path d="M 93 106 Q 100 114 107 106" stroke="#27272A" stroke-width="3" stroke-linecap="round" fill="none"/>
                <!-- Holding '100分' Mini Flag -->
                <line x1="140" y1="140" x2="140" y2="60" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
                <path d="M 140 65 L 185 80 L 140 95 Z" fill="#EF4444"/>
                <text x="145" y="84" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">讚!</text>
            </svg>
            `
        ];

        // Encouragement Messages for Reward Modal
        const Encouragements = [
            { main: "「太棒了！你選得非常精準喔！」", sub: "加 10 分！平權觀念超級清晰！" },
            { main: "「不愧是你！簡直是平權小天才！」", sub: "加 10 分！繼續保持這個氣勢！" },
            { main: "「答對了！為你的平權意識點讚！」", sub: "加 10 分！一步步向平權大師邁進！" },
            { main: "「太厲害啦！完全難不倒你呢！」", sub: "加 10 分！給自己一個大大的掌聲！" }
        ];

        // 3 Question Sets (Each containing concepts for 'equal' or 'unequal')
        const QuestionSets = [
            // Set 1
            [
                { id: 'q1', text: '家務工作由全家人依能力分工合作', type: 'equal' },
                { id: 'q2', text: '公司以「照顧家庭」為由優先升遷男性員工', type: 'unequal' }
            ],
            // Set 2
            [
                { id: 'q3', text: '不論性別，任何人都可自由選擇喜歡的玩具與興趣', type: 'equal' },
                { id: 'q4', text: '認為男生哭泣就是軟弱缺乏男子氣概', type: 'unequal' }
            ],
            // Set 3
            [
                { id: 'q5', text: '企業提供同工同酬與平等的育嬰假政策', type: 'equal' },
                { id: 'q6', text: '面試時詢問女性求職者「近期是否有結婚懷孕計畫」', type: 'unequal' }
            ]
        ];

        // Game State Variables
        let currentSetIndex = 0;
        let score = 0;
        let setCorrectCount = 0;
        let draggedElement = null;

        // DOM Element References
        const scoreDisplay = document.getElementById('score-display');
        const dragContainer = document.getElementById('drag-cards-container');
        const dropZoneEqual = document.getElementById('drop-zone-equal');
        const dropZoneUnequal = document.getElementById('drop-zone-unequal');
        const rewardModal = document.getElementById('reward-modal');
        const cheerGirlSvgContainer = document.getElementById('cheer-girl-svg-container');
        const cheerMessage = document.getElementById('cheer-message');
        const cheerSubtext = document.getElementById('cheer-subtext');
        const btnNextStep = document.getElementById('btn-next-step');
        const resultModal = document.getElementById('result-modal');
        const progressDots = document.getElementById('progress-dots');
        const setCounterText = document.getElementById('set-counter-text');

        // Initialize game on window load
        window.onload = function() {
            loadQuestionSet(currentSetIndex);
            setupDropZones();
        };

        // Render Question Cards for Current Set
        function loadQuestionSet(setIndex) {
            dragContainer.innerHTML = '';
            setCorrectCount = 0;

            // Reset Drop Targets UI
            resetDropZoneUI(dropZoneEqual, 'equal');
            resetDropZoneUI(dropZoneUnequal, 'unequal');

            // Update Progress Indicator
            updateProgressDots(setIndex);

            const currentCards = QuestionSets[setIndex];
            
            // Shuffle cards for presentation
            const shuffledCards = [...currentCards].sort(() => Math.random() - 0.5);

            shuffledCards.forEach(cardData => {
                const cardEl = document.createElement('div');
                cardEl.id = cardData.id;
                cardEl.dataset.type = cardData.type;
                cardEl.draggable = true;
                cardEl.className = "card-item bg-white border-2 border-pink-200 rounded-2xl p-4 shadow-md hover:shadow-lg cursor-grab active:cursor-grabbing transition-all flex items-center justify-between gap-3 transform hover:-translate-y-1";
                cardEl.innerHTML = `
                    <span class="text-gray-800 font-bold text-sm md:text-base leading-snug">${cardData.text}</span>
                    <span class="text-pink-400 text-lg flex-shrink-0"><i class="fa-solid fa-hand-pointer"></i></span>
                `;

                // Add Drag Event Listeners
                cardEl.addEventListener('dragstart', handleDragStart);
                cardEl.addEventListener('dragend', handleDragEnd);

                // Touch Event Listeners for Mobile Accessibility
                cardEl.addEventListener('touchstart', handleTouchStart, { passive: false });
                cardEl.addEventListener('touchmove', handleTouchMove, { passive: false });
                cardEl.addEventListener('touchend', handleTouchEnd);

                dragContainer.appendChild(cardEl);
            });
        }

        function resetDropZoneUI(zone, type) {
            const container = zone.querySelector('.cards-target');
            const placeholderText = type === 'equal' ? '拖曳「平等情境」放置於此' : '拖曳「不平等情境」放置於此';
            const textColor = type === 'equal' ? 'text-emerald-400' : 'text-rose-400';
            
            container.innerHTML = `<p class="placeholder-text ${textColor} font-bold text-sm text-center">${placeholderText}</p>`;
        }

        function updateProgressDots(index) {
            const dots = progressDots.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === index) {
                    dots[i].className = "w-3 h-3 rounded-full bg-pink-500 ring-2 ring-pink-200";
                } else if (i < index) {
                    dots[i].className = "w-3 h-3 rounded-full bg-emerald-500";
                } else {
                    dots[i].className = "w-3 h-3 rounded-full bg-gray-300";
                }
            }
            setCounterText.innerText = `第 ${index + 1} / 3 組`;
        }

        // HTML5 Drag Handlers
        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.setData('text/plain', this.id);
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            draggedElement = null;
        }

        // Setup Drop Target Zone Listeners
        function setupDropZones() {
            const zones = [dropZoneEqual, dropZoneUnequal];

            zones.forEach(zone => {
                zone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.classList.add('drop-target-active');
                });

                zone.addEventListener('dragleave', function() {
                    this.classList.remove('drop-target-active');
                });

                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drop-target-active');
                    
                    if (!draggedElement) return;

                    const targetType = this.dataset.type;
                    const cardType = draggedElement.dataset.type;

                    verifyAnswer(draggedElement, cardType, targetType, this);
                });
            });
        }

        // Mobile Touch Drag Support
        let touchTargetZone = null;
        function handleTouchStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
        }

        function handleTouchMove(e) {
            if (!draggedElement) return;
            e.preventDefault();
            const touch = e.touches[0];
            
            // Highlight zones under touch
            const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            const zone = elementUnder ? elementUnder.closest('.drop-zone') : null;

            dropZoneEqual.classList.remove('drop-target-active');
            dropZoneUnequal.classList.remove('drop-target-active');

            if (zone) {
                zone.classList.add('drop-target-active');
                touchTargetZone = zone;
            } else {
                touchTargetZone = null;
            }
        }

        function handleTouchEnd(e) {
            if (!draggedElement) return;
            draggedElement.classList.remove('dragging');

            if (touchTargetZone) {
                const targetType = touchTargetZone.dataset.type;
                const cardType = draggedElement.dataset.type;
                verifyAnswer(draggedElement, cardType, targetType, touchTargetZone);
                touchTargetZone.classList.remove('drop-target-active');
            }

            touchTargetZone = null;
            draggedElement = null;
        }

        // Answer Verification and Score Update
        function verifyAnswer(cardEl, cardType, targetType, dropZone) {
            if (cardType === targetType) {
                // CORRECT ANSWER
                score += 10;
                setCorrectCount++;
                scoreDisplay.innerText = score;

                // Move Card inside Drop Zone
                const targetContainer = dropZone.querySelector('.cards-target');
                const placeholder = targetContainer.querySelector('.placeholder-text');
                if (placeholder) placeholder.remove();

                cardEl.classList.remove('hover:-translate-y-1', 'cursor-grab', 'shadow-md');
                cardEl.classList.add('bg-emerald-100/80', 'border-emerald-400', 'w-full', 'py-2', 'px-3');
                cardEl.draggable = false;
                cardEl.innerHTML = `
                    <span class="text-emerald-900 font-bold text-xs md:text-sm">${cardEl.innerText}</span>
                    <span class="text-emerald-600 font-bold text-lg">✓</span>
                `;
                targetContainer.appendChild(cardEl);

                // Show Cheer Girl Reward Modal
                showRewardModal();

            } else {
                // INCORRECT ANSWER
                cardEl.classList.add('animate-shake', 'border-rose-500', 'bg-rose-50');
                setTimeout(() => {
                    cardEl.classList.remove('animate-shake', 'border-rose-500', 'bg-rose-50');
                }, 800);

                // Floating wrong hint
                showTemporaryToast('再想想看喔！這個情境屬於另一個類別～ 💡');
            }
        }

        // Show Schoolgirl Cheer Reward Popup
        function showRewardModal() {
            // Pick a random cheer girl illustration
            const randomGirlIndex = Math.floor(Math.random() * CheerGirls.length);
            cheerGirlSvgContainer.innerHTML = CheerGirls[randomGirlIndex];

            // Pick a random encouraging phrase
            const randomMsg = Encouragements[Math.floor(Math.random() * Encouragements.length)];
            cheerMessage.innerText = randomMsg.main;
            cheerSubtext.innerText = randomMsg.sub;

            // Display modal
            rewardModal.classList.remove('hidden');
        }

        // Handle Next Step / Next Question Set Button
        btnNextStep.onclick = function() {
            rewardModal.classList.add('hidden');

            // Check if current set completed (2 cards placed correctly)
            if (setCorrectCount >= 2) {
                currentSetIndex++;
                if (currentSetIndex < QuestionSets.length) {
                    loadQuestionSet(currentSetIndex);
                } else {
                    // All 3 sets completed -> Show End Game Result
                    showEndGameResult();
                }
            }
        };

        // Show End Game Result Modal based on Total Score
        function showEndGameResult() {
            const finalScoreEl = document.getElementById('final-score');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');
            const resultIcon = document.getElementById('result-icon');
            const btnRestart = document.getElementById('btn-restart');
            const btnCertificate = document.getElementById('btn-certificate');

            finalScoreEl.innerText = score;

            // Score Logic:
            // 60 Points (Perfect) -> 平權達人 + Certificate Link
            // 40-50 Points -> 進步中 + Restart Button
            // < 40 Points -> 再加油 + Restart Button
            if (score === 60) {
                resultIcon.innerText = '🏆';
                resultTitle.innerText = '平權達人';
                resultTitle.className = "text-3xl font-black text-amber-500 mb-2";
                resultDesc.innerText = '太精彩了！你對性別平等情境有非常深刻且正確的理解！快領取專屬證書吧！';
                
                btnCertificate.classList.remove('hidden');
                btnRestart.classList.add('hidden');
            } else if (score >= 40) {
                resultIcon.innerText = '🌟';
                resultTitle.innerText = '進步中';
                resultTitle.className = "text-3xl font-black text-blue-600 mb-2";
                resultDesc.innerText = '做得很不錯喔！已經掌握大部分平權概念了，再挑戰一次拿滿分吧！';
                
                btnRestart.classList.remove('hidden');
                btnCertificate.classList.add('hidden');
            } else {
                resultIcon.innerText = '🌱';
                resultTitle.innerText = '再加油';
                resultTitle.className = "text-3xl font-black text-rose-500 mb-2";
                resultDesc.innerText = '沒關係，學習平權需要一點時間！重新挑戰看看，你一定能做得更好！';
                
                btnRestart.classList.remove('hidden');
                btnCertificate.classList.add('hidden');
            }

            resultModal.classList.remove('hidden');
        }

        // Restart Button Click Event
        document.getElementById('btn-restart').onclick = function() {
            score = 0;
            currentSetIndex = 0;
            scoreDisplay.innerText = score;
            resultModal.classList.add('hidden');
            loadQuestionSet(0);
        };

        // Temporary Toast Message Utility
        function showTemporaryToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800/90 text-white font-bold text-sm px-6 py-3 rounded-full shadow-xl z-50 animate-pop-in';
            toast.innerText = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
